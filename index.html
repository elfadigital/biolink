<body class="min-h-screen font-sans antialiased transition-colors duration-300 flex justify-center

  <div class="fixed inset-0 bg-dots pointer-events-none z-0"></div>

  <main class="relative z-10 w-full max-w-md px-5 py-10 sm:py-14 flex flex-col items-center">

    <!-- Top Bar -->
    <header class="w-full flex items-center justify-between mb-10 px-1">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs font-mono
                  border-neutral-200 bg-white/80 backdrop-blur-md
                  dark:border-neutral-800 dark:bg-neutral-900/80">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="statusLabel" class="text-neutral-600 dark:text-neutral-300">Online</span>
      </div>

      <button onclick="toggleTheme()" aria-label="Ganti Tema"
              class="p-2.5 rounded-full border transition-all
                     border-neutral-200 bg-white hover:bg-neutral-100
                     dark:border-neutral-800 dark:bg-neutral-900 dark:hover:bg-neutral-800">

      </button>
    </header>

    <section id="profileSection" class="flex flex-col items-center text-center w-full mb-10"></section>

    <!-- Links -->
    <section id="linksSection" class="w-full space-y-3 mb-12"></section>

    <!-- Contact Us -->
    <section id="contactsWrapper" class="w-full mb-8 hidden">
      <div class="flex items-center gap-4 mb-4">
        <div class="flex-1 h-px bg-neutral-200 dark:bg-neutral-800"></div>
        <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-400 dark:text-neutral-500">Contact Us</span>
        <div class="flex-1 h-px bg-neutral-200 dark:bg-neutral-800"></div>
      </div>
      <div id="contactsSection" class="flex items-center justify-center gap-3 flex-wrap"></div>
    </section>

    <!-- Follow Us -->
    <section id="socialsWrapper" class="w-full mb-10 hidden">
      <div class="flex items-center gap-4 mb-4">
        <div class="flex-1 h-px bg-neutral-200 dark:bg-neutral-800"></div>
        <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-400 dark:text-neutral-500">Follow Us</span>
        <div class="flex-1 h-px bg-neutral-200 dark:bg-neutral-800"></div>
      </div>
      <div id="socialsSection" class="flex items-center justify-center gap-3 flex-wrap"></div>
    </section>

      <p id="footerText" class="text-[11px] font-mono text-neutral-400 dark:text-neutral-500"></p>

    // Fallback icon for unknown platforms
    const FALLBACK_ICON = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>`;

    // ===== URL BUILDER =====
    function buildUrl(platform, value, urlMap) {
      const prefix = urlMap[platform];
      if (prefix) return prefix + value;
      // If value looks like a URL already, use it directly
      if (value.startsWith('http') || value.startsWith('mailto:') || value.startsWith('tel:')) return value;
      // Fallback: guess a URL
      return 'https://' + platform + '.com/' + value;
    }

    // ===== LOAD & RENDER =====
    async function init() {
      let data;
      try {
        const res = await fetch(`./data.json?v=${Date.now()}`);
        if (res.ok) data = await res.json();
      } catch(e) {}

      if (!data) {
        data = { name: 'ELFA DIGITAL', slogan: 'Digital Will Live on Forever', monogram: 'ED', links: [], socials: {}, contacts: {}, footer: '' };
      }

      // Dynamically set Document Title and Meta Tags
      document.title = data.name;
      document.getElementById('metaDesc').setAttribute('content', data.slogan);
      document.getElementById('ogTitle').setAttribute('content', data.name);
      document.getElementById('ogDesc').setAttribute('content', data.slogan);

      if (data.status) document.getElementById('statusLabel').textContent = data.status;

      renderProfile(data);
      renderLinks(data.links || []);
      renderIconGroup('socialsWrapper', 'socialsSection', data.socials || {}, SOCIAL_URLS);
      renderIconGroup('contactsWrapper', 'contactsSection', data.contacts || {}, CONTACT_URLS);
      document.getElementById('footerText').textContent = data.footer || '';
    }

    function renderProfile(data) {
      const initials = data.monogram || data.name.split(' ').map(w => w[0]).join('').substring(0, 2);
      
      document.getElementById('profileSection').innerHTML = `
        <div class="group mb-5">
          <div class="w-24 h-24 sm:w-28 sm:h-28 shadow-2xl overflow-hidden
                      transition-transform duration-300 group-hover:scale-105
                      bg-neutral-900 dark:bg-black relative">
            
            <!-- Fallback Monogram (Shown if images fail to load or haven't been uploaded yet) -->
            <div id="fallbackAvatar" class="absolute inset-0 hidden flex-col items-center justify-center h-full w-full bg-neutral-900 dark:bg-black">
              <span class="font-mono text-3xl sm:text-4xl font-black tracking-tighter text-white">${initials}</span>
            </div>

            <!-- Light Mode Logo -->
            <img src="assets/logo-light.png" alt="${data.name}"
                 class="w-full h-full object-cover dark:hidden block"
                 onerror="document.getElementById('fallbackAvatar').classList.remove('hidden'); document.getElementById('fallbackAvatar').classList.add('flex'); this.style.display='none';">

            <!-- Dark Mode Logo -->
            <img src="assets/logo-dark.png" alt="${data.name}"
                 class="w-full h-full object-cover hidden dark:block"
                 onerror="document.getElementById('fallbackAvatar').classList.remove('hidden'); document.getElementById('fallbackAvatar').classList.add('flex'); this.style.display='none';">
                 
          </div>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight font-mono
                    text-neutral-900 dark:text-white">${data.name}</h1>
        <p class="text-sm mt-1.5 font-light tracking-wide
                  text-neutral-500 dark:text-neutral-400">${data.slogan}</p>
      `;
    }

    function renderLinks(links) {
      document.getElementById('linksSection').innerHTML = links.map(link => `
        <a href="${link.url}" target="_blank" rel="noopener noreferrer"
           class="group block w-full py-3.5 px-6 text-center rounded-2xl border
                  text-sm font-semibold tracking-wide
                  transition-all duration-300 hover:scale-[1.02] hover:shadow-lg
                  border-neutral-200 bg-white text-neutral-900
                  hover:bg-neutral-900 hover:text-white hover:border-neutral-900
                  dark:border-neutral-800 dark:bg-transparent dark:text-white
                  dark:hover:bg-white dark:hover:text-black dark:hover:border-white">
          ${link.title}
        </a>
      `).join('');
    }

    function renderIconGroup(wrapperId, containerId, items, urlMap) {
      // Filter out empty values
      const entries = Object.entries(items).filter(([_, val]) => val && val.trim() !== '');

      if (entries.length === 0) {
        document.getElementById(wrapperId).classList.add('hidden');
        return;
      }

      document.getElementById(wrapperId).classList.remove('hidden');
      document.getElementById(containerId).innerHTML = entries.map(([platform, value]) => {
        const url = buildUrl(platform, value, urlMap);
        const icon = ICONS[platform] || FALLBACK_ICON;
        const label = platform.charAt(0).toUpperCase() + platform.slice(1);

        return `
          <a href="${url}" target="_blank" rel="noopener noreferrer"
             aria-label="${label}" title="${label}"
             class="p-3 rounded-full border transition-all duration-300 hover:scale-110
                    border-neutral-200 bg-white text-neutral-700
                    hover:bg-neutral-900 hover:text-white hover:border-neutral-900
                    dark:border-neutral-800 dark:bg-neutral-900 dark:text-white
                    dark:hover:bg-white dark:hover:text-black dark:hover:border-white">
            ${icon}
          </a>
        `;
      }).join('');
    }

    // ===== THEME TOGGLE =====
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
